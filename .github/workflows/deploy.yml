name: Build, Push and Deploy API Gateway

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: "Trigger deployment to EC2 after building"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image (linux/amd64 for EC2)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || inputs.deploy_to_ec2 == true }}
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

    steps:
      - name: Skip deployment when EC2 secrets are not configured
        if: ${{ env.EC2_HOST == '' || env.EC2_SSH_KEY == '' }}
        run: echo "::notice::EC2 deployment skipped because EC2_HOST or EC2_SSH_KEY is not configured."

      - name: SSH to EC2 and trigger API Gateway deployment
        if: ${{ env.EC2_HOST != '' && env.EC2_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER || 'ubuntu' }}
          key: ${{ env.EC2_SSH_KEY }}
          script: |
            set -e
            echo "[+] Accessing infra directory..."
            cd /home/ubuntu/infra || cd ~/infra
            echo "[+] Pulling latest infra scripts..."
            git pull --ff-only
            echo "[+] Pulling latest API Gateway image and reloading container..."
            DEPLOY_STACK=edge bash ./scripts/deploy.sh api-gateway
